<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard — RoadRescue</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="navbar">
    <a class="brand" th:href="@{/}">Road<span class="dot">Rescue</span></a>
    <nav>
      <span class="user-pill" th:text="${customer.fullName}">Name</span>
      <a class="btn btn-outline" th:href="@{/logout}">Log Out</a>
    </nav>
  </div>

  <div class="page-wrap">
    <div class="dash-header">
      <h1>Hi, <span th:text="${customer.fullName}">Customer</span> 👋</h1>
      <span class="badge">Customer Account</span>
    </div>

    <div class="grid-2">
      <div class="card">
        <h3 style="margin-top:0;">Need help right now?</h3>
        <p style="color:var(--muted); font-size:0.9rem;">We'll capture your live GPS location and notify nearby helpers instantly.</p>
        <form id="sosForm" th:action="@{/customer/request}" method="post" onsubmit="submitSosRequest(event)">
          <input type="hidden" id="latInput" name="lat">
          <input type="hidden" id="lngInput" name="lng">
          <div class="form-group">
            <label>What's wrong?</label>
            <textarea name="issue" rows="3" placeholder="e.g. Flat tire, engine won't start, out of fuel..."></textarea>
          </div>
          <button id="sosBtn" type="submit" class="btn btn-primary btn-block">🚨 Send SOS Request</button>
        </form>
      </div>

      <div class="card">
        <h3 style="margin-top:0;">Your Vehicle</h3>
        <p><strong>Vehicle Number:</strong> <span th:text="${customer.vehicleNumber} ?: 'Not set'"></span></p>
        <p><strong>Phone:</strong> <span th:text="${customer.phone}"></span></p>
        <p><strong>Email:</strong> <span th:text="${customer.email}"></span></p>
      </div>
    </div>

    <div class="card" style="margin-top:24px;">
      <h3 style="margin-top:0;">Your Request History</h3>
      <table class="list" th:if="${!history.isEmpty()}">
        <thead>
          <tr><th>Date</th><th>Issue</th><th>Status</th><th>Helper</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="req : ${history}">
            <td th:text="${#temporals.format(req.createdAt, 'dd MMM, hh:mm a')}"></td>
            <td th:text="${req.issueDescription} ?: '—'"></td>
            <td><span class="status-pill" th:classappend="'status-' + ${req.status}" th:text="${req.status}"></span></td>
            <td th:text="${req.helper != null ? req.helper.fullName : 'Waiting...'}"></td>
            <td><a class="btn btn-dark" style="padding:6px 16px; font-size:0.8rem;" th:href="@{'/track/' + ${req.id}}">View</a></td>
          </tr>
        </tbody>
      </table>
      <div class="empty-state" th:if="${history.isEmpty()}">No requests yet. Stay safe out there!</div>
    </div>
  </div>

  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
