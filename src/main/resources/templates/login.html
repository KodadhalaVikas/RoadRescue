<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — RoadRescue</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="navbar">
    <a class="brand" th:href="@{/}">Road<span class="dot">Rescue</span></a>
    <nav><a class="btn btn-primary" th:href="@{/signup}">Sign Up</a></nav>
  </div>

  <div class="card auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to your RoadRescue account.</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <p class="auth-footer">New to RoadRescue? <a th:href="@{/signup}">Create an account</a></p>
  </div>
</body>
</html>
